<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古文狐小文的文語文法教室｜日文古文文法入門</title>
<style>
:root{
  --bg:#fff8e8; --ink:#3a2e28; --card:#ffffff; --line:#f0e0c8;
  --orange:#f59f3a; --red:#ff6b6b; --blue:#4dabf7; --green:#40c057; --purple:#9775fa; --pink:#f06595; --teal:#20c997; --yellow:#ffd43b;
  --mz:#ff6b6b; --ry:#ff922b; --sh:#40c057; --rt:#339af0; --iz:#845ef7; --mr:#f06595;
}
*{box-sizing:border-box}
html{font-size:19px}
@media (max-width:600px){html{font-size:17px}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.75;
  background-image:radial-gradient(circle at 10% 10%,#ffe8cc 0,transparent 30%),radial-gradient(circle at 90% 30%,#e7f5ff 0,transparent 30%),radial-gradient(circle at 30% 90%,#ebfbee 0,transparent 30%);background-attachment:fixed}
[lang=ja],.jp{font-family:"Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
ruby rt{font-size:.5em;color:#d9480f;font-weight:500;letter-spacing:0}
a{color:#1971c2}
header{position:sticky;top:0;z-index:20;background:rgba(255,248,232,.95);backdrop-filter:blur(6px);border-bottom:3px dashed #ffd8a8;display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem}
header .logo{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:1.05rem;cursor:pointer;flex:1;min-width:0}
header .logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header svg{width:42px;height:42px;flex:none}
.navbtn{border:none;background:#fff;border:2px solid #ffc078;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:700;cursor:pointer;color:#d9480f;font-family:inherit;white-space:nowrap}
.navbtn:hover{background:#fff4e6}
main{max-width:880px;margin:0 auto;padding:1rem .8rem 4rem}
h1{font-size:1.7rem;margin:.2rem 0 .6rem;line-height:1.35}
h2{font-size:1.45rem;margin:.2rem 0 .7rem;line-height:1.4;color:#c2410c}
h3{font-size:1.15rem;margin:1rem 0 .4rem;color:#5f3dc4}
.card{background:var(--card);border-radius:24px;padding:1.2rem 1.3rem;box-shadow:0 6px 0 #f3d9b1,0 10px 30px rgba(180,120,40,.12);border:3px solid #ffe3bf;margin-bottom:1rem}
.hero{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.hero svg{width:130px;height:130px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .txt{flex:1;min-width:240px}
.progress{height:22px;background:#fff0db;border-radius:999px;overflow:hidden;border:2px solid #ffd8a8}
.progress>div{height:100%;background:linear-gradient(90deg,#ffa94d,#ff6b6b,#f06595);border-radius:999px;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.lcard{background:#fff;border-radius:20px;padding:.9rem 1rem;border:3px solid var(--c,#ffd8a8);cursor:pointer;position:relative;transition:transform .15s, box-shadow .15s;box-shadow:0 5px 0 var(--c,#ffd8a8)}
.lcard:hover{transform:translateY(-3px)}
.lcard .em{font-size:2rem;line-height:1}
.lcard .no{font-size:.8rem;font-weight:800;color:#868e96}
.lcard .t{font-weight:900;font-size:1.05rem;line-height:1.4;margin:.15rem 0}
.lcard .s{font-size:.85rem;color:#666}
.badge{position:absolute;top:.6rem;right:.7rem;font-size:.8rem;font-weight:800;border-radius:999px;padding:.05rem .55rem;background:#f1f3f5;color:#868e96}
.badge.done{background:#d3f9d8;color:#2b8a3e}
.badge.part{background:#fff3bf;color:#e67700}
/* lesson */
.lessonbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.lessonbar .lt{font-weight:900;font-size:1.05rem;flex:1}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:.2rem 0 .8rem}
.dots i{width:14px;height:14px;border-radius:50%;background:#ffe8cc;display:block;cursor:pointer;border:2px solid #ffc078}
.dots i.on{background:#ff922b;transform:scale(1.25)}
.dots i.seen{background:#ffc078}
.dots i.q{border-radius:4px;background:#d0bfff;border-color:#9775fa}
.screen{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.pager{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}
.btn{font-family:inherit;font-size:1.05rem;font-weight:800;border:none;border-radius:999px;padding:.65rem 1.3rem;cursor:pointer;background:#ff922b;color:#fff;box-shadow:0 4px 0 #d9480f;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9480f}
.btn.gray{background:#e9ecef;color:#495057;box-shadow:0 4px 0 #adb5bd}
.btn.purple{background:#845ef7;box-shadow:0 4px 0 #5f3dc4}
.btn.green{background:#40c057;box-shadow:0 4px 0 #2b8a3e}
.btn:disabled{opacity:.35;cursor:default}
/* teaching blocks */
.say{display:flex;gap:.7rem;align-items:flex-start;margin:.4rem 0 .9rem}
.say svg{width:62px;height:62px;flex:none}
.bubble{background:#fff4e6;border:2px solid #ffc078;border-radius:18px;padding:.6rem .9rem;position:relative;flex:1}
.bubble:before{content:"";position:absolute;left:-11px;top:18px;border:9px solid transparent;border-right-color:#ffc078;border-left:0}
.ex{background:#f8f9ff;border-left:7px solid #748ffc;border-radius:14px;padding:.6rem .9rem;margin:.6rem 0}
.ex .jp{font-size:1.45rem;line-height:2.2;font-weight:700}
.ex .zh{color:#495057}
.ex .zh:before{content:"🇹🇼 "}
.ex .note{font-size:.9rem;color:#7048e8;margin-top:.2rem}
.bigidea{font-size:1.25rem;font-weight:900;background:linear-gradient(120deg,#fff3bf,#ffe8cc);border-radius:16px;padding:.7rem 1rem;margin:.6rem 0;text-align:center;line-height:1.6}
.tip{background:#e6fcf5;border:2px dashed #20c997;border-radius:14px;padding:.55rem .85rem;margin:.6rem 0}
.warn{background:#fff5f5;border:2px dashed #ff8787;border-radius:14px;padding:.55rem .85rem;margin:.6rem 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.5rem 0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.95rem;background:#fff;border-radius:14px;overflow:hidden;border:2px solid #e9ecef}
th,td{padding:.4rem .5rem;border-bottom:1px solid #f1f3f5;text-align:center;vertical-align:middle}
th{background:#f8f9fa;font-weight:800;white-space:nowrap}
td.l,th.l{text-align:left;min-width:11em}
td.f1,td.f2,td.f3,td.f4,td.f5,td.f6{white-space:nowrap}
table.wide{min-width:1000px}
td.kid{min-width:9em;text-align:left}
tr:last-child td{border-bottom:none}
td .jp,td[lang=ja]{font-size:1.08rem}
.f1{--fc:var(--mz)} .f2{--fc:var(--ry)} .f3{--fc:var(--sh)} .f4{--fc:var(--rt)} .f5{--fc:var(--iz)} .f6{--fc:var(--mr)}
th.f1,th.f2,th.f3,th.f4,th.f5,th.f6{background:var(--fc);color:#fff}
td.f1,td.f2,td.f3,td.f4,td.f5,td.f6{background:color-mix(in srgb,var(--fc) 10%,white);color:color-mix(in srgb,var(--fc) 70%,black);font-weight:700}
.fz{display:inline-block;border-radius:8px;padding:0 .4rem;color:#fff;background:var(--fc);font-weight:800;font-size:.9em;margin:0 .1rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem .6rem;align-items:center;margin:.6rem 0}
.vs .h{font-weight:900;text-align:center;border-radius:12px;padding:.2rem;color:#fff}
.vs .h.m{background:#4dabf7}.vs .h.k{background:#f76707}
.vs .c{background:#f8f9fa;border-radius:12px;padding:.35rem .6rem;font-size:1.15rem;text-align:center}
.vs .c.k{background:#fff4e6;font-weight:700}
.vs .ar{font-size:1.2rem;color:#adb5bd}
.vs .z{grid-column:1/-1;font-size:.88rem;color:#666;text-align:center;margin:-.2rem 0 .3rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .2rem;align-items:flex-start}
.chip{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:.15rem .45rem .2rem;border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,white);min-width:2.4rem}
.chip b{font-size:1.3rem;font-family:"Noto Sans CJK JP",sans-serif;line-height:2}
.chip small{font-size:.68rem;color:color-mix(in srgb,var(--cc) 75%,black);font-weight:700;line-height:1.3;text-align:center;max-width:9rem}
.c-n{--cc:#adb5bd}.c-v{--cc:#339af0}.c-j{--cc:#40c057}.c-k{--cc:#12b886}.c-a{--cc:#f03e3e}.c-p{--cc:#9c36b5}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.8rem;margin:.3rem 0}
.legend span{border-radius:999px;padding:0 .5rem;border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,white)}
.list{padding-left:1.2rem;margin:.3rem 0}
.list li{margin:.2rem 0}
.formcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem;margin:.6rem 0}
.formcard{border-radius:16px;padding:.6rem .8rem;border:3px solid var(--fc);background:color-mix(in srgb,var(--fc) 8%,white)}
.formcard .n{font-weight:900;color:var(--fc);font-size:1.1rem}
.formcard .w{font-size:1.3rem;font-weight:700}
.song{background:linear-gradient(135deg,#e7f5ff,#f3f0ff);border-radius:16px;padding:.5rem .9rem;margin:.5rem 0;border:2px solid #bac8ff}
.line{border-bottom:2px dotted #dee2e6;padding:.5rem 0 .6rem}
.line:last-child{border-bottom:none}
.line .jp{font-size:1.3rem;font-weight:800;line-height:2.1}
.line .zh{color:#495057;font-size:.95rem}
.line .g{font-size:.88rem;color:#5f3dc4}
.yt{display:inline-flex;align-items:center;gap:.3rem;background:#ff0000;color:#fff !important;text-decoration:none;font-weight:800;border-radius:999px;padding:.2rem .8rem;font-size:.9rem;margin:.2rem 0}
.flow{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0}
.flow .step{border-radius:14px;padding:.5rem .8rem;background:#f3f0ff;border-left:7px solid #845ef7}
.machine{background:#fff9db;border:3px solid #fcc419;border-radius:18px;padding:.8rem}
.machine select{font-family:inherit;font-size:1rem;padding:.3rem .5rem;border-radius:10px;border:2px solid #fcc419}
.machine .fbtns{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
.machine .fbtns button{font-family:inherit;font-weight:800;border:none;border-radius:999px;padding:.35rem .8rem;color:#fff;background:var(--fc);cursor:pointer;font-size:.95rem;opacity:.75}
.machine .fbtns button.on{opacity:1;outline:3px solid #212529}
.machine .out{background:#fff;border-radius:14px;padding:.6rem;text-align:center;min-height:4.5rem}
.machine .out .w{font-size:2rem;font-weight:900}
.machine .out .w em{font-style:normal;color:#adb5bd}
.switch{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.switch button{font-family:inherit;font-size:1rem;font-weight:800;border:2px solid #9775fa;background:#fff;color:#5f3dc4;border-radius:999px;padding:.3rem .9rem;cursor:pointer}
.switch button.on{background:#9775fa;color:#fff}
.kout{font-size:1.6rem;font-weight:900;text-align:center;background:#f8f0fc;border-radius:16px;padding:.6rem;line-height:2.2}
.kout .hl{background:#ffe066;border-radius:8px;padding:0 .2rem}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#7048e8;margin-bottom:.4rem}
.qtext{font-size:1.25rem;font-weight:800;margin:.3rem 0 .8rem;line-height:1.9}
.opts{display:grid;gap:.55rem}
.opt{font-family:inherit;text-align:left;font-size:1.1rem;font-weight:700;border:3px solid #dee2e6;background:#fff;border-radius:16px;padding:.6rem .9rem;cursor:pointer;transition:transform .1s;color:var(--ink);line-height:1.8}
.opt:hover:not(:disabled){border-color:#9775fa;transform:translateX(3px)}
.opt.correct{border-color:#40c057;background:#ebfbee}
.opt.correct:after{content:" ✅"}
.opt.wrong{border-color:#fa5252;background:#fff5f5;animation:shake .4s}
.opt.wrong:after{content:" ❌"}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:.8rem;border-radius:16px;padding:.7rem .9rem;font-size:1rem}
.fb.ok{background:#ebfbee;border:2px solid #69db7c}
.fb.ng{background:#fff9db;border:2px solid #ffd43b}
.fb .m{font-weight:900;font-size:1.1rem}
.result{text-align:center}
.stars{font-size:2.8rem;letter-spacing:.3rem}
.confetti{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;animation:fall 2.2s linear forwards;z-index:99}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
/* reference */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.tabs button{font-family:inherit;font-weight:800;font-size:.92rem;border:2px solid #74c0fc;background:#fff;color:#1864ab;border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.tabs button.on{background:#339af0;color:#fff}
.grp{display:inline-block;border-radius:8px;padding:0 .45rem;color:#fff;font-weight:800;font-size:.85rem}
.small{font-size:.85rem;color:#666}
.foot{text-align:center;font-size:.8rem;color:#999;margin-top:2rem}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('#/')" id="logo"></div>
  <button class="navbtn" onclick="go('#/')">🏠 首頁</button>
  <button class="navbtn" onclick="go('#/ref')">📚 速查表</button>
</header>
<main id="app"></main>
<script>
"use strict";
/* ===== 小幫手函式 ===== */
const R = s => String(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const FOX = (id)=>`<svg viewBox="0 0 120 120" aria-label="古文狐小文"><path d="M20 54 L28 8 L56 38 Z" fill="#f08a24"/><path d="M27 46 L31 20 L47 38Z" fill="#ffd9b0"/><path d="M100 54 L92 8 L64 38 Z" fill="#f08a24"/><path d="M93 46 L89 20 L73 38Z" fill="#ffd9b0"/><ellipse cx="60" cy="66" rx="43" ry="39" fill="#f6a03c"/><path d="M17 68 Q60 122 103 68 Q92 106 60 107 Q28 106 17 68Z" fill="#fff6ea"/><ellipse cx="43" cy="62" rx="5.5" ry="7.5" fill="#3b2a20"/><ellipse cx="77" cy="62" rx="5.5" ry="7.5" fill="#3b2a20"/><circle cx="45" cy="59" r="2" fill="#fff"/><circle cx="79" cy="59" r="2" fill="#fff"/><ellipse cx="60" cy="80" rx="6.5" ry="4.8" fill="#3b2a20"/><path d="M51 88 Q60 96 69 88" stroke="#3b2a20" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="31" cy="78" r="6" fill="#ff8fab" opacity=".55"/><circle cx="89" cy="78" r="6" fill="#ff8fab" opacity=".55"/><circle cx="60" cy="34" r="11" fill="#e8590c" stroke="#fff" stroke-width="2.5"/><text x="60" y="39.5" font-size="14" text-anchor="middle" fill="#fff" font-weight="900" font-family="Noto Sans CJK JP,sans-serif">古</text></svg>`;
const say = t => `<div class="say">${FOX()}<div class="bubble">${t}</div></div>`;
const ex = (jp, zh, note) => `<div class="ex"><div class="jp" lang="ja">${jp}</div><div class="zh">${zh}</div>${note?`<div class="note">👉 ${note}</div>`:''}</div>`;
const big = t => `<div class="bigidea">${t}</div>`;
const tip = t => `<div class="tip">💡 ${t}</div>`;
const warn = t => `<div class="warn">⚠️ ${t}</div>`;
const T = (h, rows, cls) => `<div class="tw"><table class="${cls||''}"><thead><tr>${h.map(x=>typeof x==='string'?`<th>${x}</th>`:`<th class="${x.c}">${x.t}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>typeof x==='string'?`<td>${x}</td>`:`<td class="${x.c||''}" ${x.ja?'lang="ja"':''}>${x.t}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const FORMS = ['未然形','連用形','終止形','連体形','已然形','命令形'];
const FH = () => FORMS.map((f,i)=>({t:f,c:'f'+(i+1)}));
const FC = (arr) => arr.map((x,i)=>({t:x.replace(/・/g,'<br>'),c:'f'+(i+1),ja:1}));
const fz = (i, t) => `<span class="fz f${i}">${t||FORMS[i-1]}</span>`;
/* vs: 現代語 ↔ 古語 */
const vs = rows => `<div class="vs"><div class="h m">現代語</div><div></div><div class="h k">古語</div>${rows.map(r=>`<div class="c" lang="ja">${r[0]}</div><div class="ar">⇄</div><div class="c k" lang="ja">${r[1]}</div>${r[2]?`<div class="z">${r[2]}</div>`:''}`).join('')}</div>`;
/* chips：把一句話拆成小積木。類型 n=名詞等, v=動詞, j=形容詞, k=形容動詞, a=助動詞, p=助詞 */
const B = parts => `<div class="chips" lang="ja">${parts.map(p=>`<div class="chip c-${p[1]}"><b>${p[0]}</b>${p[2]?`<small lang="zh-Hant-TW">${p[2]}</small>`:''}</div>`).join('')}</div>`;
const LEGEND = `<div class="legend"><span class="c-v">動詞</span><span class="c-j">形容詞</span><span class="c-k">形容動詞</span><span class="c-a">助動詞</span><span class="c-p">助詞</span><span class="c-n">名詞・其他</span></div>`;
const line = (jp, zh, parts, g) => `<div class="line"><div class="jp" lang="ja">${jp}</div><div class="zh">🇹🇼 ${zh}</div>${parts?B(parts):''}${g?`<div class="g">🦊 ${g}</div>`:''}</div>`;
const yt = (url, name) => `<a class="yt" href="${url}" target="_blank" rel="noopener">▶ YouTube 聽〈${name}〉</a>`;
const SONGS = {
  nobara:{name:'野ばら',url:'https://www.youtube.com/watch?v=3bLFgapvm7g'},
  furusato:{name:'ふるさと',url:'https://www.youtube.com/watch?v=p1eZ8sIDF1A'},
  umi:{name:'われは海の子',url:'https://www.youtube.com/watch?v=6-oj3fHoYbo'},
  aogeba:{name:'仰げば尊し',url:'https://www.youtube.com/watch?v=ERuAlRzITX0'}
};
/* ===== 依據「文語動詞活用表」 ===== */
const VERBS = [
 {k:'yodan', type:'四段活用', ex:'{思|おも}ふ', stem:'おも', gyo:'ハ行', f:['は','ひ','ふ','ふ','へ','へ'], snd:['a','i','u','u','e','e'],
  full:['{思|おも}は','{思|おも}ひ','{思|おも}ふ','{思|おも}ふ','{思|おも}へ','{思|おも}へ'], modern:'五段活用（思う）', zh:'想'},
 {k:'kami1', type:'上一段活用', ex:'{見|み}る', stem:'（み）', gyo:'マ行', f:['み','み','みる','みる','みれ','みよ'], snd:['i','i','iる','iる','iれ','iよ'],
  full:['{見|み}','{見|み}','{見|み}る','{見|み}る','{見|み}れ','{見|み}よ'], modern:'上一段活用（見る）', zh:'看'},
 {k:'shimo1', type:'下一段活用', ex:'{蹴|け}る', stem:'（け）', gyo:'カ行', f:['け','け','ける','ける','けれ','けよ'], snd:['e','e','eる','eる','eれ','eよ'],
  full:['{蹴|け}','{蹴|け}','{蹴|け}る','{蹴|け}る','{蹴|け}れ','{蹴|け}よ'], modern:'五段活用（蹴る）', zh:'踢'},
 {k:'kami2', type:'上二段活用', ex:'{過|す}ぐ', stem:'す', gyo:'ガ行', f:['ぎ','ぎ','ぐ','ぐる','ぐれ','ぎよ'], snd:['i','i','u','uる','uれ','iよ'],
  full:['{過|す}ぎ','{過|す}ぎ','{過|す}ぐ','{過|す}ぐる','{過|す}ぐれ','{過|す}ぎよ'], modern:'上一段活用（過ぎる）', zh:'經過'},
 {k:'shimo2', type:'下二段活用', ex:'{尋|たづ}ぬ', stem:'たづ', gyo:'ナ行', f:['ね','ね','ぬ','ぬる','ぬれ','ねよ'], snd:['e','e','u','uる','uれ','eよ'],

  ${next?`<button class="btn" onclick="go('#/lesson/${LESSONS.indexOf(next)}')">${done?'▶ 繼續學習：':'🚀 開始第一課：'}${next.title}</button>`:`<button class="btn green" onclick="go('#/ref')">🏆 全部完成！去看速查表</button>`}</div></div>

  <div class="small" style="margin-top:.4rem">進度會自動存在這台裝置的瀏覽器裡。 <a href="javascript:void(0)" onclick="if(confirm('確定要清除所有進度嗎？')){P={};save();home();}">重新開始</a></div></div>
  <div class="grid">${LESSONS.map((l,i)=>{const s=lp(l.id);
    const b=s.done?`<span class="badge done">${stars(s.best,s.total)}</span>`:s.seen>0?`<span class="badge part">學習中</span>`:`<span class="badge">未開始</span>`;
    return `<div class="lcard" style="--c:${l.color}" onclick="go('#/lesson/${i}')" id="card-${l.id}">${b}<div class="em">${l.emoji}</div><div class="no">第 ${i} 課</div><div class="t">${R(l.title)}</div><div class="s">${R(l.sub)}</div></div>`;}).join('')}
    <div class="lcard" style="--c:#74c0fc" onclick="go('#/ref')"><div class="em">📚</div><div class="no">隨時查</div><div class="t">彩色速查表</div><div class="s">動詞・形容詞・助動詞・助詞・假名規則</div></div>
  </div>
  <div class="foot">內容依據：〈今も使われている古語〉投影片、文語助動詞活用表、文語動詞・形容詞・形容動詞活用表、文語助詞の主な意味・用法・接続。</div>`;
  scrollTo(0,0);
}

/* ===== 課程頁 ===== */
function lesson(i, s){
  const L=LESSONS[i]; if(!L) return home();
  const n=L.screens.length; s=Math.max(0,Math.min(n-1,s|0));
  const st=lp(L.id); st.seen=Math.max(st.seen,s+1); save();
  app.innerHTML=`<div class="lessonbar"><button class="navbtn" onclick="go('#/')">← 回首頁</button><div class="lt">${L.emoji} 第 ${i} 課｜${R(L.title)}</div></div>
  <div class="dots">${L.screens.map((_,k)=>`<i class="${k===s?'on':k<st.seen?'seen':''}" title="第${k+1}頁" onclick="go('#/lesson/${i}/${k}')"></i>`).join('')}<i class="q" title="小測驗" onclick="go('#/quiz/${i}')"></i></div>
  <div class="card screen">${R(L.screens[s])}</div>
  <div class="pager"><button class="btn gray" ${s===0?'disabled':''} onclick="go('#/lesson/${i}/${s-1}')">← 上一頁</button>
  <span class="small" style="align-self:center">${s+1} / ${n}</span>
  ${s<n-1?`<button class="btn" onclick="go('#/lesson/${i}/${s+1}')">下一頁 →</button>`:`<button class="btn purple" id="toQuiz" onclick="go('#/quiz/${i}')">🎯 小測驗</button>`}</div>`;
  mountWidgets(); scrollTo(0,0);
}

/* ===== 小測驗 ===== */
let Q=null;
function quiz(i){
  const L=LESSONS[i]; if(!L) return home();
  Q={i, k:0, score:0, answered:false};
  drawQ();
}
function drawQ(){
  const L=LESSONS[Q.i], it=L.quiz[Q.k];
  app.innerHTML=`<div class="lessonbar"><button class="navbtn" onclick="go('#/lesson/${Q.i}/0')">← 回到課程</button><div class="lt">🎯 第 ${Q.i} 課 小測驗</div></div>
  <div class="card screen"><div class="qhead"><span>第 ${Q.k+1} 題 / 共 ${L.quiz.length} 題</span><span id="qscore">得分 ${Q.score}</span></div>
  <div class="progress" style="height:12px"><div style="width:${Q.k/L.quiz.length*100}%"></div></div>
  ${say(Q.k===0?'準備好了嗎？點選你覺得對的答案！':'下一題來囉！')}
  <div class="qtext" lang="zh-Hant-TW">${R(it.q)}</div>
  <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}" onclick="answer(${j})">${String.fromCharCode(65+j)}. ${R(o)}</button>`).join('')}</div>
  <div id="fb"></div></div>`;
  scrollTo(0,0);
}
function answer(j){
  if(Q.answered) return; Q.answered=true;
  const it=LESSONS[Q.i].quiz[Q.k], ok=j===it.a; if(ok) Q.score++;
  document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true; if(x===it.a) b.classList.add('correct'); else if(x===j) b.classList.add('wrong');});
  const last=Q.k===LESSONS[Q.i].quiz.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><div class="m">${ok?pick(CHEER_OK):pick(CHEER_NG)}</div>${ok?'':`正確答案是 <b>${String.fromCharCode(65+it.a)}</b>。`}${R(it.why)}</div>
  <div class="pager"><span></span><button class="btn ${last?'green':''}" id="nextQ" onclick="nextQ()">${last?'看結果 🏁':'下一題 →'}</button></div>`;
  if(ok) confetti(6);
  document.getElementById('qscore').textContent='得分 '+Q.score;
}
function nextQ(){
  const L=LESSONS[Q.i];
  if(Q.k<L.quiz.length-1){Q.k++;Q.answered=false;drawQ();return;}
  const st=lp(L.id); st.done=true; st.total=L.quiz.length; st.best=Math.max(st.best||0,Q.score); save();
  const r=Q.score/L.quiz.length;
  const msg=r===1?'全對！你是古文小天才 🏆':r>=0.6?'很棒！再複習一下就完美了 🌟':'加油！回去再看一次課程，下次一定更好 💪';
  const nx=LESSONS[Q.i+1];
  app.innerHTML=`<div class="card screen result">${say(msg)}<div class="stars">${stars(Q.score,L.quiz.length)}</div>
  <h2>答對 ${Q.score} / ${L.quiz.length} 題</h2><p class="small">最佳紀錄：${st.best} / ${st.total}</p>
  <div class="pager" style="justify-content:center;flex-wrap:wrap"><button class="btn gray" onclick="go('#/quiz/${Q.i}')">🔁 再挑戰</button>
  <button class="btn gray" onclick="go('#/lesson/${Q.i}/0')">📖 複習課程</button>
  ${nx?`<button class="btn" id="nextLesson" onclick="go('#/lesson/${Q.i+1}')">下一課 →</button>`:`<button class="btn green" onclick="go('#/ref')">📚 速查表</button>`}</div></div>`;
  confetti(r===1?40:15); scrollTo(0,0);
}
function confetti(n){ const em=['🎉','⭐','🌸','✨','🦊','🍁']; for(let k=0;k<n;k++){const d=document.createElement('div');d.className='confetti';d.textContent=pick(em);d.style.left=Math.random()*100+'vw';d.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);} }

/* ===== 互動小工具 ===== */
function mountWidgets(){
  const vm=document.getElementById('verb-machine');
  if(vm){
    vm.innerHTML=`<div class="machine"><label>選動詞：<select id="vmSel">${VERBS.map((v,k)=>`<option value="${k}">${v.ex.replace(/\{([^|]+)\|[^}]+\}/g,'$1')}（${v.type}）</option>`).join('')}</select></label>
    <div class="fbtns">${FORMS.map((f,k)=>`<button class="f${k+1}" data-k="${k}">${f}</button>`).join('')}</div><div class="out" id="vmOut">👆 按一個活用形</div></div>`;
    let cur=0;
    const draw=()=>{const v=VERBS[+vm.querySelector('#vmSel').value]; const f=FOLLOW[cur];
      vm.querySelectorAll('.fbtns button').forEach((b,k)=>b.classList.toggle('on',k===cur));
      vm.querySelector('#vmOut').innerHTML=`<div class="w" lang="ja">${R(v.full[cur])}<em>${f.w==='。'||f.w==='！'?f.w:'＋'+f.w}</em></div><div>${R(v.ex)}（${v.zh}）的<b>${FORMS[cur]}</b>：${f.zh}</div><div class="small">字尾母音：${v.snd[cur]}｜現代語：${v.modern}</div>`;};
    vm.querySelector('#vmSel').onchange=draw;
    vm.querySelectorAll('.fbtns button').forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw();});
    draw();
  }
  const ks=document.getElementById('kakari-switch');
  if(ks){
    const opts=[
      {p:'は',end:'なり',form:'終止形',zh:'這是寶物。',note:'沒有魔法開關 → 照常用終止形'},
      {p:'ぞ',end:'なる',form:'連体形',zh:'這（就）是寶物！（強調）',note:'ぞ → 連体形'},
      {p:'なむ',end:'なる',form:'連体形',zh:'這（就）是寶物！（強調）',note:'なむ → 連体形'},
      {p:'か',end:'なる',form:'連体形',zh:'是這個（才）是寶物嗎？（疑問）',note:'か → 連体形'},
      {p:'こそ',end:'なれ',form:'已然形',zh:'這個才是寶物！（最強調）',note:'こそ → 已然形'}];
    ks.innerHTML=`<div class="switch">${opts.map((o,k)=>`<button data-k="${k}">${o.p}</button>`).join('')}</div><div class="kout" id="kOut"></div>`;
    const draw=k=>{const o=opts[k]; ks.querySelectorAll('button').forEach((b,x)=>b.classList.toggle('on',x===k));
      ks.querySelector('#kOut').innerHTML=`<span lang="ja">これ<span class="hl">${o.p}</span>{宝|たから}<span class="hl">${o.end}</span></span><div style="font-size:1rem;font-weight:700">🇹🇼 ${o.zh}</div><div style="font-size:.9rem;color:#5f3dc4">${o.note}（斷定「なり」的${o.form}）</div>`.replace(/\{([^{}|]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');};
    ks.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(+b.dataset.k)); draw(0);
  }
}

/* ===== 速查表 ===== */
const REFTABS=[
 ['verb','🏃 動詞'],['adj','🌸 形容詞・形容動詞'],['aux','⏰ 助動詞'],['part','🔗 助詞'],['kana','📖 假名規則'],['forms','👕 活用形']
];
function ref(tab){
  tab=tab||'verb';
  let h='';
  if(tab==='verb'){
    h=`<h2>🏃 文語動詞活用表</h2>${T(['種類','例','語幹','行',...FH(),'現代語'],VERBS.map(v=>[{t:'<b>'+v.type+'</b>'},{t:v.ex,ja:1},{t:v.stem,ja:1},{t:v.gyo},...FC(v.f),{t:v.modern,ja:1}]))}
    <h3>🔍 分辨方法</h3><ul class="list"><li><b>カ變</b>：来｜<b>サ變</b>：す・おはす（＋名詞す 等）｜<b>ナ變</b>：死ぬ・往ぬ（去ぬ）｜<b>ラ變</b>：あり・をり・はべり・いまそかり</li>
    <li><b>上一段</b>：干る・射る・鋳る・着る・似る・煮る・見る・居る・率る（ひいきにみゐる）｜<b>下一段</b>：蹴る</li>
    <li>其他：加「ず」→ <span class="fz f1">a段</span>四段　<span class="fz f2">i段</span>上二段　<span class="fz f4">e段</span>下二段</li></ul>`;
  } else if(tab==='adj'){
    h=`<h2>🌸 文語形容詞活用表</h2>${AT()}<p class="small">後面接助動詞時多用補助活用（カリ活用）。分法：加「なる」→「～くなる」是ク活用、「～しくなる」是シク活用。</p>
    <h2>🌊 文語形容動詞活用表</h2>${AVT()}`;
  } else if(tab==='aux'){
    h=`<h2>⏰ 文語助動詞活用表</h2><p class="small">依「前面要接哪一種活用形（接續）」分顏色。「○」＝沒有這個形。</p>`+
    AUXG.map(g=>`<h3><span class="grp" style="background:${g.c}">${g.g}</span></h3>`+T(['助動詞','意思（原表）','白話',...FH(),'活用の型','接續'],g.items.map(it=>[{t:'<b>'+it.w+'</b>',ja:1},{t:it.m,ja:1,c:'l'},{t:it.kid,c:'kid'},...FC(it.f),{t:it.t,ja:1},{t:it.s,ja:1,c:'l'}]),'wide')).join('')+
    `<h3><span class="grp" style="background:#868e96">上代（奈良時代）の助動詞</span></h3>`+T(['助動詞','意思',...FH(),'活用の型','接續'],JODAI_AUX.map(it=>[{t:'<b>'+it.w+'</b>',ja:1},{t:it.m,ja:1},...FC(it.f),{t:it.t,ja:1},{t:it.s,ja:1,c:'l'}]));
  } else if(tab==='part'){
    h=`<h2>🔗 文語助詞的主要意思・用法・接續</h2>`+PARTS.map(g=>`<h3><span class="grp" style="background:${g.c}">${g.g}</span> <span class="small">${g.d}</span></h3>`+T(['助詞','意味・用法','接續'],g.items.map(r=>[{t:'<b>'+r[0]+'</b>',ja:1},{t:r[1],ja:1,c:'l'},{t:r[2],ja:1}]))).join('')+
    `<div class="bigidea">係り結び：ぞ・なむ・や・か → <span class="fz f4">連体形</span>　こそ → <span class="fz f5">已然形</span></div>`;
  } else if(tab==='kana'){
    h=`<h2>📖 歷史的仮名遣い → 現代讀音</h2>`+T(['規則','舊寫法','念成','例'],[
     ['① 字中・字尾的は行','は・ひ・ふ・へ・ほ','わ・い・う・え・お',{t:'にほふ→におう、おもふ→おもう、いはく→いわく',ja:1}],
     ['② ゐ・ゑ・を','ゐ・ゑ・を','い・え・お',{t:'くれなゐ→くれない、こゑ→こえ、をとこ→おとこ',ja:1}],
     ['③ ぢ・づ','ぢ・づ','じ・ず',{t:'いづ→いず、はぢ→はじ',ja:1}],
     ['④ 長音','ア段＋う（ふ）','オー',{t:'やうやう→ようよう、あふぎ→おうぎ',ja:1}],
     ['','イ段＋う（ふ）','ユー',{t:'うつくしう→うつくしゅう、きうり→きゅうり',ja:1}],
     ['','エ段＋う（ふ）','ヨー',{t:'けふ→きょう、てふてふ→ちょうちょう',ja:1}],
     ['⑤ む','む（助動詞等）','ん',{t:'ゆかむ→ゆかん、つねならむ→つねならん',ja:1}],
     ['⑥ くわ・ぐわ','くわ・ぐわ','か・が',{t:'くわし→かし、くわじ→かじ',ja:1}]])+
     `<h3>いろは歌</h3>`+T(['舊假名','現代寫法'],[['いろはにほへと ちりぬるを','色は匂えど 散りぬるを'],['わかよたれそ つねならむ','我が世誰ぞ 常ならん'],['うゐのおくやま けふこえて','有為の奥山 今日越えて'],['あさきゆめみし ゑひもせす','浅き夢見じ 酔いもせず']].map(r=>[{t:r[0],ja:1},{t:r[1],ja:1}]));
  } else if(tab==='forms'){
    h=`<h2>👕 六種活用形與常見的「後面的朋友」</h2>`+T(['活用形','意思','後面常接'],[
     [{t:'未然形',c:'f1'},'還沒發生',{t:'ず・む・じ・る・らる・す・さす・しむ・まし・まほし・ば（如果）・で・ばや・なむ',ja:1,c:'l'}],
     [{t:'連用形',c:'f2'},'連接用言',{t:'き・けり・つ・ぬ・たり・けむ・たし・て・つつ・ながら・用言',ja:1,c:'l'}],
     [{t:'終止形',c:'f3'},'句子結束',{t:'。・べし・らむ・らし・めり・まじ・なり（傳聞）・とも・な（禁止）',ja:1,c:'l'}],
     [{t:'連体形',c:'f4'},'連接名詞',{t:'体言・なり（斷定）・ごとし・が・に・を・ものの　＋　ぞ・なむ・や・か 的結び',ja:1,c:'l'}],
     [{t:'已然形',c:'f5'},'已經發生',{t:'ば（因為／一～就）・ど・ども・り（四段）　＋　こそ 的結び',ja:1,c:'l'}],
     [{t:'命令形',c:'f6'},'命令',{t:'。・よ',ja:1,c:'l'}]]);
  }
  app.innerHTML=`<div class="lessonbar"><button class="navbtn" onclick="go('#/')">← 回首頁</button><div class="lt">📚 彩色速查表</div></div>
  <div class="tabs">${REFTABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('#/ref/${t[0]}')">${t[1]}</button>`).join('')}</div>
  <div class="card screen">${R(h)}<p class="small">色彩：${FORMS.map((f,k)=>fz(k+1,f)).join(' ')}</p></div>`;
  scrollTo(0,0);
}

/* ===== 路由 ===== */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='lesson') lesson(+h[1]||0, +h[2]||0);
  else if(h[0]==='quiz') quiz(+h[1]||0);
  else if(h[0]==='ref') ref(h[1]);
  else home();
}
route();
</script>
