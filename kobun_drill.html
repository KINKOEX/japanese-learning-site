<script>
"use strict";
/* ====== 活用資料 ====== */
const ROWS={'あ':'あいうえお','か':'かきくけこ','が':'がぎぐげご','さ':'さしすせそ','ざ':'ざじずぜぞ','た':'たちつてと','だ':'だぢづでど','な':'なにぬねの','は':'はひふへほ','ば':'ばびぶべぼ','ま':'まみむめも','や':'やいゆえよ','ら':'らりるれろ','わ':'わゐうゑを'};
const FORMS=['未然形','連用形','終止形','連体形','已然形','命令形'];
const TYPES={
 yodan:{n:'四段活用',cat:'v'}, kami1:{n:'上一段活用',cat:'v'}, shimo1:{n:'下一段活用',cat:'v'},
 kami2:{n:'上二段活用',cat:'v'}, shimo2:{n:'下二段活用',cat:'v'},
 ka:{n:'カ行変格活用',cat:'v'}, sa:{n:'サ行変格活用',cat:'v'}, na:{n:'ナ行変格活用',cat:'v'}, ra:{n:'ラ行変格活用',cat:'v'},
 ku:{n:'ク活用（形容詞）',cat:'a'}, shiku:{n:'シク活用（形容詞）',cat:'a'}, nari:{n:'ナリ活用（形容動詞）',cat:'a'}, tari:{n:'タリ活用（形容動詞）',cat:'a'}
};
const VTYPES=['yodan','kami1','shimo1','kami2','shimo2','ka','sa','na','ra'];
const ATYPES=['ku','shiku','nari','tari'];
/* 回傳某型別的 6 個活用形（每格可能有多個，如 本活用／補助活用） */
function endings(t,g,z){
  const r=ROWS[g]||'', A=r[0],I=r[1],U=r[2],E=r[3];
  switch(t){
   case 'yodan': return [[A],[I],[U],[U],[E],[E]];
   case 'kami1': return [[I],[I],[I+'る'],[I+'る'],[I+'れ'],[I+'よ']];
   case 'shimo1':return [['け'],['け'],['ける'],['ける'],['けれ'],['けよ']];
   case 'kami2': return [[I],[I],[U],[U+'る'],[U+'れ'],[I+'よ']];
   case 'shimo2':return [[E],[E],[U],[U+'る'],[U+'れ'],[E+'よ']];
   case 'ka':    return [['こ'],['き'],['く'],['くる'],['くれ'],['こ','こよ']];
   case 'sa':    return z?[['ぜ'],['じ'],['ず'],['ずる'],['ずれ'],['ぜよ']]:[['せ'],['し'],['す'],['する'],['すれ'],['せよ']];
   case 'na':    return [['な'],['に'],['ぬ'],['ぬる'],['ぬれ'],['ね']];
   case 'ra':    return [['ら'],['り'],['り'],['る'],['れ'],['れ']];
   case 'ku':    return [['（く）','から'],['く','かり'],['し'],['き','かる'],['けれ'],['かれ']];
   case 'shiku': return [['（しく）','しから'],['しく','しかり'],['し'],['しき','しかる'],['しけれ'],['しかれ']];
   case 'nari':  return [['なら'],['なり','に'],['なり'],['なる'],['なれ'],['（なれ）']];
   case 'tari':  return [['（たら）'],['たり','と'],['たり'],['たる'],['（たれ）'],['（たれ）']];
  }
}
const clean=x=>x.replace(/[（）]/g,'');
function wordForms(it){ return endings(it.t,it.g,it.zz).map(c=>c.map(e=>it.st+clean(e))); }
/* ====== 助動詞 ====== */
const AUX={
 ki:{w:'き',m:'過去',ty:'特殊型',c:'連用形（カ変・サ変には未然形にも）',f:[['（せ）'],[],['き'],['し'],['しか'],[]]},
 keri:{w:'けり',m:'過去・詠嘆',ty:'ラ変型',c:'連用形',f:[['（けら）'],[],['けり'],['ける'],['けれ'],[]]},
 tsu:{w:'つ',m:'完了・強意',ty:'下二段型',c:'連用形',f:[['て'],['て'],['つ'],['つる'],['つれ'],['てよ']]},
 nu:{w:'ぬ',m:'完了・強意',ty:'ナ変型',c:'連用形',f:[['な'],['に'],['ぬ'],['ぬる'],['ぬれ'],['ね']]},
 tari:{w:'たり',m:'完了・存続',ty:'ラ変型',c:'連用形',f:[['たら'],['たり'],['たり'],['たる'],['たれ'],['（たれ）']]},
 ri:{w:'り',m:'完了・存続',ty:'ラ変型',c:'サ変の未然形・四段の已然形',f:[['ら'],['り'],['り'],['る'],['れ'],['（れ）']]},
 zu:{w:'ず',m:'打消',ty:'特殊型',c:'未然形',f:[['（ず）','ざら'],['ず','ざり'],['ず'],['ぬ','ざる'],['ね','ざれ'],['ざれ']]},
 ji:{w:'じ',m:'打消推量・打消意志',ty:'特殊型',c:'未然形',f:[[],[],['じ'],['（じ）'],['（じ）'],[]]},
 mu:{w:'む（ん）',m:'推量・意志・適当・勧誘・仮定・婉曲',ty:'四段型',c:'未然形',f:[['（ま）'],[],['む','ん'],['む','ん'],['め'],[]]},

const MEMBERS={kami1:'干る・射る・鋳る・着る・似る・煮る・見る・居る・率る（口訣：ひいきにみゐる；另有「顧みる」「用ゐる」等複合字）',shimo1:'蹴る（只有這一個）',ka:'来（く）（以及「出で来」等複合字）',sa:'す・おはす，以及「名詞／漢字＋す（ず）」的複合字（例：愛す、軽んず）',na:'死ぬ・往ぬ（去ぬ）兩個',ra:'あり・をり（居り）・はべり（侍り）・いまそかり'};

/* 終止形（辭書形） */
function dictOf(it){ if(it.cat==='aux') return null; const e=endings(it.t,it.g,it.zz); return it.st+clean(e[2][0]); }
function dictChoices(it){
  const st=it.st, r=ROWS[it.g]||'', c=dictOf(it); let cand;
  switch(it.t){
   case 'yodan':case 'kami1':case 'kami2':case 'shimo2': cand=[st+r[2]+'る',st+r[1]+'る',st+r[3]+'る',st+r[0]+'る',st+r[2]]; break;
   case 'shimo1': cand=['く','かる','けり']; break;
   case 'ka': cand=['くる','こ','きる']; break;
   case 'sa': cand=it.zz?[st+'ずる',st+'じる',st+'ぜる']:[st+'する',st+'しる',st+'せる']; break;
   case 'na': cand=[st+'ぬる',st+'ねる',st+'にる']; break;
   case 'ra': cand=[st+'る',st+'れる',st+'らる']; break;
   case 'ku': cand=[st+'い',st+'き',st+'く']; break;
   case 'shiku': cand=[st+'しい',st+'しき',st+'しく']; break;
   case 'nari': cand=[st+'だ',st+'なる',st+'に']; break;
   case 'tari': cand=[st+'たる',st+'と',st+'だ']; break;
  }
  const d=[...new Set(cand)].filter(x=>x!==c).slice(0,3);
  return shuffle([c,...d]);
}
/* 這個字的整排活用 */
function cellsOf(it){ if(it.cat==='aux') return AUX[it.a].f.map(c=>c.slice()); return endings(it.t,it.g,it.zz).map(c=>c.map(e=>(e.startsWith('（')?'（'+it.st+clean(e)+'）':it.st+e))); }
function cellsClean(it){ return cellsOf(it).map(c=>c.map(clean)); }
function rowTable(it){
  const cells=cellsOf(it);
  const name=it.cat==='aux'?`助動詞「${AUX[it.a].w}」（${AUX[it.a].ty}）`:`${TYPES[it.t].n}「${dictOf(it)}」`;
  return `<div class="tw"><table><thead><tr><th>${name}</th>${FORMS.map((f,k)=>`<th class="f${k+1}">${f}</th>`).join('')}</tr></thead><tbody><tr><td class="small">${it.cat==='aux'?'接續：'+AUX[it.a].c:'語幹：'+(it.st||'（無區別）')}</td>${cells.map((c,k)=>`<td class="f${k+1} ${k===it.f?'hit':''}" lang="ja">${c.length?c.join('<br>'):'○'}</td>`).join('')}</tr></tbody></table></div>`;
}
/* ====== 解說 ====== */
function typeReason(it){
  const d=dictOf(it);
  if(it.cat==='aux'){const A=AUX[it.a]; return `「${it.hlk}」是助動詞「${A.w}」（${A.m}）的${FORMS[it.f]}。「${A.w}」接${A.c}，前面的「${it.pv}」正好符合。`;}
  switch(it.t){
   case 'yodan':case 'kami2':case 'shimo2':{
     const mz=it.st+endings(it.t,it.g)[0][0]; const v=vowelOf(mz.slice(-1));
     return `「${d}」加「ず」→「${mz}ず」，「ず」前面是「${mz.slice(-1)}」（${v} 段）→ ${TYPES[it.t].n}${it.t==='kami2'?'（而且它不是上一段「ひいきにみゐる」的成員）':''}。`; }
   case 'kami1': return `「${d}」是上一段的成員（口訣「ひいきにみゐる」）→ 上一段活用。`;
   case 'shimo1': return `下一段活用只有「蹴る」一個字！`;
   case 'ka': return `「来（く）」是カ行變格活用唯一的動詞（念法：こ・き・く・くる・くれ・こ（よ））。`;
   case 'sa': return `「${d}」是${it.zz?'「軽ん＋す」變成濁音「ず」的':''}サ行變格活用（す・おはす，以及名詞＋す）。`;
   case 'na': return `「${d}」是ナ行變格活用（只有「死ぬ」「往ぬ」兩個字）。`;
   case 'ra': return `「${d}」是ラ行變格活用（あり・をり・はべり・いまそかり），終止形是「り」。`;
   case 'ku': return `終止形是「${d}」（～し）→ 形容詞。加「なる」→「${it.st}くなる」→ ク活用。`;
   case 'shiku': return `終止形是「${d}」（～し）→ 形容詞。加「なる」→「${it.st}しくなる」→ シク活用。`;
   case 'nari': return `終止形是「${d}」（～なり）→ 形容動詞ナリ活用（像現代的「～だ／～な」）。`;
   case 'tari': return `終止形是「${d}」（～たり）→ 形容動詞タリ活用（漢語＋たり）。`;
  }
}
function typeWrong(it,p){
  const d=dictOf(it);
  if(it.cat==='aux'){
    const P=AUX[p], has=P.f.map(c=>c.map(clean)).findIndex(c=>c.includes(it.hlk));
    const row=P.f.map(c=>c.length?c.join('/'):'○').join('・');
    return has>=0?`你選的「${P.w}」（${P.m}）也有「${it.hlk}」這個形（${FORMS[has]}），但是「${P.w}」接${P.c}；這裡前面是「${it.pv}」，所以不是它。`
                 :`你選的「${P.w}」（${P.m}）的活用是「${row}」，裡面沒有「${it.hlk}」這個形。`;
  }
  const isRow=t=>['yodan','kami2','shimo2'].includes(t);
  if(TYPES[p].cat!==TYPES[it.t].cat) return '';
  if(it.cat==='a'){
    const adjP=['ku','shiku'].includes(p), adjI=['ku','shiku'].includes(it.t);
    if(adjP&&!adjI) return `你選的${TYPES[p].n}是形容詞，終止形是「～し」；但這個字的終止形是「${d}」→ 是形容動詞。`;
    if(!adjP&&adjI) return `你選的${TYPES[p].n}是形容動詞，終止形是「～${p==='nari'?'なり':'たり'}」；但這個字的終止形是「${d}」（～し）→ 是形容詞。`;
    if(adjP) return `如果是${TYPES[p].n}，加「なる」會是「${it.st}${p==='ku'?'く':'しく'}なる」；但正確的說法是「${it.st}${it.t==='ku'?'く':'しく'}なる」。`;
    return `你選的${TYPES[p].n}，終止形應該是「～${p==='nari'?'なり':'たり'}」；這個字是「${d}」。`;
  }
  if(MEMBERS[p]) return `你選的${TYPES[p].n}只有：${MEMBERS[p]}。「${d}」不在裡面喔。`;
  if(MEMBERS[it.t]) return `「${d}」是要特別背的${TYPES[it.t].n}成員，不能用「加ず看母音」的方法把它當成${TYPES[p].n}。`;
  if(isRow(p)){ const e=endings(p,it.g); const want=it.st+e[0][0]; return `如果是${TYPES[p].n}，加「ず」應該是「${want}ず」（${vowelOf(want.slice(-1))} 段），${FORMS[it.f]}會是「${it.st+clean(e[it.f].join('／'))}」；可是這裡是「${it.hlk}」。`; }
  return '';
}
function formReason(it){ return NX[it.n][1]; }
function formWrong(it,p){
  const cells=cellsClean(it);
  if(cells[p].includes(it.hlk)) return `「${it.hlk}」的${FORMS[p]}剛好也長這樣，所以不能只看形狀，要看前後文！${FORMS[p]}通常是：${FORM_USE[p]}。`;
  const disp=cellsOf(it)[p];
  return `如果是${FORMS[p]}，應該是「${disp.length?disp.join('／'):'（沒有這個形）'}」，不是「${it.hlk}」。${FORMS[p]}通常是：${FORM_USE[p]}。`;
}

S.missed=S.missed||{}; S.best=S.best||{}; S.bestStreak=S.bestStreak||0; S.opt=S.opt||{n:10,q3:true};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const app=document.getElementById('app');
/* ====== 選關畫面 ====== */
function home(){

  <div class="lcard" id="lvall" style="--c:#845ef7" onclick="start(0)"><div class="em">🌈</div><div class="t">全部混合</div><div class="s">從所有題目隨機出題</div><div class="small">📝 ${ITEMS.length} 題</div></div>

  ${nMiss?`<div class="card"><b>📒 錯題本</b><ul class="list">${Object.keys(S.missed).map(id=>{const it=ITEMS.find(x=>x.id===id); return it?`<li lang="ja">${R(it.s.replace(/【([^】]+)】/,'<span class="hlw">$1</span>'))} <span class="small">（Lv${it.l}，錯 ${S.missed[id]} 次）</span></li>`:'';}).join('')}</ul>
  <button class="btn gray" onclick="if(confirm('清空錯題本？')){S.missed={};save();home();}">清空錯題本</button></div>`:''}

/* ====== 出題 ====== */
let G=null;
function start(l){
  let pool=l===-1?ITEMS.filter(i=>S.missed[i.id]):l===0?ITEMS.slice():ITEMS.filter(i=>i.l===l);
  pool=shuffle(pool); if(S.opt.n&&l!==-1) pool=pool.slice(0,S.opt.n);
  G={l,pool,k:0,score:0,streak:0,wrongs:[]};
  draw();
}
function draw(){
  const it=G.pool[G.k];
  G.cur={step:1,ok:[]};
  const sent=R(it.s.replace(/【([^】]+)】/,'<span class="hlw">$1</span>'));
  app.innerHTML=`<div class="lessonbar"><button class="navbtn" onclick="home()">← 選關</button><div class="lt">${G.l===-1?'📒 錯題複習':G.l===0?'🌈 全部混合':LEVELS[G.l-1].t}</div></div>
  <div class="card screen"><div class="qhead"><span>第 ${G.k+1} / ${G.pool.length} 題</span><span>⭐ ${G.score}　🔥 ${G.streak}</span></div>
  <div class="progress" style="height:12px"><div style="width:${G.k/G.pool.length*100}%"></div></div>
  <div class="sent" lang="ja">${sent}</div><div class="src">📖 ${it.src}　<span class="tag">Lv${it.l}</span></div>
  <div id="zh" class="zhbox hidden">🇹🇼 ${it.z}</div>
  <div id="steps"></div><div id="after"></div></div>`;
  drawStep(it); scrollTo(0,0);
}
function q1Options(it){
  if(it.cat==='aux') return shuffle(it.o).map(a=>({v:a,t:`「${AUX[a].w}」（${AUX[a].m.split('・').slice(0,2).join('・')}）`}));
  if(it.cat==='a') return ATYPES.map(t=>({v:t,t:TYPES[t].n}));
  return VTYPES.map(t=>({v:t,t:TYPES[t].n}));
}
function drawStep(it){
  const box=document.getElementById('steps'); const st=G.cur.step;
  const n=document.createElement('div'); n.className='step'; n.id='step'+st;
  let title,opts;
  if(st===1){ title=it.cat==='aux'?'① 畫線的字是哪一個助動詞？':'① 這是哪一種活用？'; opts=q1Options(it); }
  else if(st===2){ title='② 這是哪一個活用形？'; opts=FORMS.map((f,k)=>({v:k,t:f,c:'f'+(k+1)})); }
  else { title='③ 它的終止形（字典裡的樣子）是？'; opts=dictChoices(it).map(x=>({v:x,t:x})); }
  n.innerHTML=`<div class="qt">${title}</div><div class="opts ${st===2?'six':st===1&&it.cat==='v'?'nine':''}">${opts.map(o=>`<button class="opt ${o.c||''}" data-v="${o.v}" lang="ja">${o.t}</button>`).join('')}</div><div class="fbx"></div>`;
  box.appendChild(n);
  n.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(it,st,b.dataset.v,n));
  if(st>1) n.scrollIntoView({behavior:'smooth',block:'start'});
}
function answer(it,st,v,n){
  if(n.dataset.done) return; n.dataset.done=1;
  let right,ok,msg;
  if(st===1){ right=it.cat==='aux'?it.a:it.t; ok=v===right;
    msg=ok?`${pick(CHEER_OK)} ${typeReason(it)}`:`正確答案是「${it.cat==='aux'?AUX[right].w:TYPES[right].n}」。<br>✅ ${typeReason(it)}<br>❌ ${typeWrong(it,v)}`; }
  else if(st===2){ right=String(it.f); ok=v===right;
    msg=ok?`${pick(CHEER_OK)} ${formReason(it)}。`:`正確答案是「${FORMS[it.f]}」。<br>✅ 為什麼：${formReason(it)}。<br>❌ ${formWrong(it,+v)}`; }
  else { right=dictOf(it); ok=v===right;
    const e=clean(endings(it.t,it.g,it.zz)[2][0]);
    msg=ok?`${pick(CHEER_OK)} ${TYPES[it.t].n}的終止形語尾是「${e}」→「${right}」。`:`正確答案是「${right}」。<br>✅ ${TYPES[it.t].n}的終止形語尾是「${e}」，所以是「${right}」。<br>❌ 「${v}」${/[いだ]$/.test(v)&&!/[しり]$/.test(v)?'是現代語的說法；':''}${cellsClean(it).some(c=>c.includes(v))?`是這個字的${FORMS[cellsClean(it).findIndex(c=>c.includes(v))]}，不是終止形；`:'不是這個字古文的終止形；'}終止形＝句子結束時、字典裡的樣子。`; }
  G.cur.ok.push(ok);
  n.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.dataset.v===right) b.classList.add('correct'); else if(b.dataset.v===v) b.classList.add('wrong');});
  n.querySelector('.fbx').innerHTML=`<div class="fb ${ok?'ok':'ng'}">${ok?'':'<div class="m">差一點！小文來解釋 🦊</div>'}${msg}</div>`;
  const total=(it.cat!=='aux'&&S.opt.q3)?3:2;
  if(st<total){ G.cur.step++; drawStep(it); } else finish(it);
}
function finish(it){
  const all=G.cur.ok.every(x=>x);
  if(all){G.score++;G.streak++; if(G.streak>S.bestStreak) S.bestStreak=G.streak; if(G.l===-1||S.missed[it.id]) delete S.missed[it.id];}
  else {G.streak=0; S.missed[it.id]=(S.missed[it.id]||0)+1; G.wrongs.push(it);}
  save();
  document.getElementById('zh').classList.remove('hidden');
  const last=G.k===G.pool.length-1;
  document.getElementById('after').innerHTML=`<div class="sum ${all?'ok':'ng'}">${all?say(pick(['全部答對！🔥 連勝 '+G.streak,'完美！小文為你拍手 👏','你是活用小偵探 🕵️']))
    :say('這題放進錯題本了，之後可以再練習一次 📒')}
  <div class="qt">📋 這個字的整排活用（黃框＝答案）</div>${rowTable(it)}</div>
  <div class="pager"><span></span><button class="btn ${last?'green':''}" id="nextQ" onclick="next()">${last?'看結果 🏁':'下一題 →'}</button></div>`;
  document.querySelector('.qhead span:last-child').textContent=`⭐ ${G.score}　🔥 ${G.streak}`;
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'start'});
}
function next(){
  if(G.k<G.pool.length-1){G.k++;draw();return;}
  const pct=Math.round(G.score/G.pool.length*100);
  if(G.l>0) S.best[G.l]=Math.max(S.best[G.l]||0,pct); save();
  const n=pct===100?3:pct>=60?2:pct>0?1:0;
  app.innerHTML=`<div class="card screen result">${say(pct===100?'全對！你是古文活用大師 🏆':pct>=60?'很棒！錯的地方看一下錯題本 🌟':'沒關係，多練幾次就會越來越熟 💪')}
  <div class="stars">${'⭐'.repeat(n)+'☆'.repeat(3-n)}</div><h2>${G.score} / ${G.pool.length} 題全對（${pct}%）</h2><p class="small">🔥 最高連勝紀錄：${S.bestStreak}</p>
  ${G.wrongs.length?`<div style="text-align:left"><b>這回答錯的題目：</b><ul class="list">${G.wrongs.map(it=>`<li lang="ja">${R(it.s.replace(/【([^】]+)】/,'<span class="hlw">$1</span>'))} → <b>${it.cat==='aux'?'助動詞「'+AUX[it.a].w+'」':TYPES[it.t].n}・${FORMS[it.f]}</b></li>`).join('')}</ul></div>`:''}
  <div class="pager" style="justify-content:center;flex-wrap:wrap"><button class="btn" onclick="start(G.l)">🔁 再來一回</button><button class="btn gray" onclick="home()">選關</button>
  ${Object.keys(S.missed).length?`<button class="btn purple" onclick="start(-1)">📒 練錯題</button>`:''}</div></div>`;
  scrollTo(0,0);
}
home();

document.querySelector('header .logo').insertAdjacentHTML('afterbegin',FOX());
</script></body></html>
